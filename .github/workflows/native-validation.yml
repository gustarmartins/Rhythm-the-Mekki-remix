name: Native Music Assistant validation
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build regressions or an isolated optimized profiling app'
        type: choice
        options: [regressions, profile]
        default: regressions
      artifact_run_id:
        description: 'Reuse signed debug APKs from a run with identical application sources'
        type: string
        required: false
        default: ''
  push:
    branches: [integration/native-player]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-player-validation-${{ github.ref }}-${{ github.sha }}-${{ inputs.build_mode || 'regressions' }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: ${{ inputs.artifact_run_id == '' && 'gradle' || '' }}
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Restore owner signing for device qualification
        if: inputs.artifact_run_id == ''
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p config/signing .config
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > config/signing/rhythm_keystore.jks
          printf '%s' "$SIGNING_PROPERTIES" | base64 --decode > .config/keystore.properties
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 --decode > config/signing/private.properties
          else
            touch config/signing/private.properties
          fi
      # Signed release/R8 qualification runs in nightly.yml; this job supplies the
      # isolated debug app and instrumentation APK for physical-device regressions.
      - name: Compile and test native playback
        if: inputs.artifact_run_id == ''
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          BUILD_MODE: ${{ inputs.build_mode || 'regressions' }}
        run: |
          set -euo pipefail
          # Private qualification builds fit between published Nightly 3001 and the next 3101.
          test "$GITHUB_RUN_NUMBER" -lt 99
          chmod +x gradlew
          if [ "$BUILD_MODE" = profile ]; then
            tasks=(-PisolatedBenchmark=true :app:assembleGithubBenchmark :macrobenchmark:assembleGithubBenchmark)
          else
            tasks=(:sendspin:testDebugUnitTest :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest)
          fi
          ./gradlew --continue --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx4500m \
            -PversionCodeOverride="$((600003001 + GITHUB_RUN_NUMBER))" \
            -PversionNameOverride="6.1.0-dev.$GITHUB_RUN_NUMBER" \
            "${tasks[@]}"
      - name: Reuse verified application sources and APKs
        if: inputs.artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          artifact_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)
          [[ "$artifact_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$artifact_sha"
          # Only workflow/documentation edits can reuse compiled code and its JVM results.
          git diff --exit-code "$artifact_sha" HEAD -- . ':!.github' ':!docs'
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n native-validation -D reused-validation
          mkdir -p app/build/outputs
          cp -R reused-validation/app/build/outputs/apk app/build/outputs/
          printf '{"artifactRunId":"%s","artifactSource":"%s","checkedSource":"%s"}\n' \
            "$BUILD_RUN" "$artifact_sha" "$GITHUB_SHA" > reused-apks.json
      - name: Run playback and sheet regressions on an emulator
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode != 'profile'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --name rhythm-regression \
            --package 'system-images;android-36;google_apis;x86_64' --device pixel_7 --force
          "$ANDROID_HOME/emulator/emulator" -avd rhythm-regression -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu lavapipe > emulator.log 2>&1 &
          emulator_pid=$!
          collect_emulator_evidence() {
            if [ -n "${logcat_pid:-}" ]; then
              kill "$logcat_pid" || true
            else
              timeout 15 adb -s emulator-5554 logcat -d -v threadtime > android-runtime.log 2>&1 || true
            fi
            timeout 10 adb -s emulator-5554 exec-out screencap -p > android-last-frame.png 2>/dev/null || true
            timeout 15 adb -s emulator-5554 shell dumpsys activity exit-info chromahub.rhythm.app.debug > android-exit-info.txt 2>&1 || true
            free -m > runner-memory.txt
            kill "$emulator_pid" || true
          }
          trap collect_emulator_evidence EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 sh -c 'until adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          timeout 120 sh -c 'until adb -s emulator-5554 shell cmd package list packages android | tr -d "\r" | grep -qx "package:android"; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent 82
          install_test_apk() {
            test "$#" -eq 1
            for attempt in 1 2 3; do
              if adb -s emulator-5554 install --no-streaming -r "$1"; then return 0; fi
              timeout 30 adb -s emulator-5554 wait-for-device
              sleep 3
            done
            return 1
          }
          install_test_apk app/build/outputs/apk/github/debug/*-x86_64.apk
          install_test_apk app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk
          adb -s emulator-5554 logcat -v threadtime > android-runtime.log 2>&1 &
          logcat_pid=$!
          # These are functional tests. Avoid debug DEX verification competing with
          # Google APIs' first-boot work until Android kills the instrumentation at startup.
          # Physical cold-launch/frame-time measurements remain a separate device check.
          timeout 180 adb -s emulator-5554 shell cmd package compile -m speed -f chromahub.rhythm.app.debug
          timeout 120 adb -s emulator-5554 shell cmd package compile -m speed -f chromahub.rhythm.app.debug.test
          adb -s emulator-5554 shell am instrument -w -r \
            -e class chromahub.rhythm.app.shared.presentation.PlaybackRegressionAndroidTest \
            chromahub.rhythm.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee playback-regressions.txt
          grep -q '^OK (' playback-regressions.txt
      - name: Preserve interaction diagnostics separately from APK downloads
        uses: actions/upload-artifact@v7
        if: always() && inputs.build_mode != 'profile'
        with:
          name: playback-regression-evidence
          path: |
            playback-regressions.txt
            emulator.log
            android-runtime.log
            android-last-frame.png
            android-exit-info.txt
            runner-memory.txt
            reused-apks.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-validation
          path: |
            **/build/test-results/
            **/build/reports/tests/
            app/build/outputs/apk/
            macrobenchmark/build/outputs/apk/
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f config/signing/rhythm_keystore.jks .config/keystore.properties config/signing/private.properties
