name: Native Music Assistant validation
on:
  push:
    branches: [integration/native-player]
permissions:
  contents: read
concurrency:
  group: native-player-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Compile and test native playback
        run: |
          chmod +x gradlew
          ./gradlew --continue --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx4500m \
            :sendspin:testDebugUnitTest :app:testGithubDebugUnitTest :app:assembleGithubDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-validation
          path: |
            **/build/test-results/
            **/build/reports/tests/
            app/build/outputs/apk/
          retention-days: 7
