# Keep this filename/workflow ID: both channels share its monotonic Android build counter.
name: Build and Publish Rhythm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Nightly from main, or Stable from a release/* branch'
        type: choice
        options: [nightly, stable]
        default: nightly
        required: true

permissions:
  contents: write

concurrency:
  group: rhythm-release-${{ github.ref }}-${{ github.sha }}-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}

jobs:
  build:
    if: >-
      github.repository == 'gustarmartins/Rhythm-the-Mekki-remix' &&
      ((github.ref == 'refs/heads/main' && inputs.channel != 'stable') ||
       (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Test release version policy
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Allocate release version
        id: version
        run: python3 scripts/nightly_version.py
      - name: Check Stable excludes Music Assistant
        if: env.RELEASE_CHANNEL == 'stable'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad = [str(p) for p in Path('app/src').rglob('*') if p.is_file()
                 and p.suffix in ('.kt', '.java', '.xml')
                 and ('musicassistant' in p.read_text().lower() or 'music_assistant' in p.read_text().lower())]
          assert not bad, 'Music Assistant must stay on Nightly: ' + ', '.join(bad)
          PY
      - name: Restore release signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE" && test -n "$SIGNING_PROPERTIES"
          umask 077
          mkdir -p config/signing .config
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > config/signing/rhythm_keystore.jks
          printf '%s' "$SIGNING_PROPERTIES" | base64 --decode > .config/keystore.properties
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 --decode > config/signing/private.properties
          else
            touch config/signing/private.properties
          fi
      - name: Test and build signed release APKs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          NIGHTLY_CODE: ${{ steps.version.outputs.code }}
          NIGHTLY_NAME: ${{ steps.version.outputs.name }}
          IS_NIGHTLY: ${{ steps.version.outputs.nightly }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx4500m \
            -PversionCodeOverride="$NIGHTLY_CODE" -PversionNameOverride="$NIGHTLY_NAME" \
            -PreleaseDateOverride="$(date -u +%F)" -Pnightly="$IS_NIGHTLY" \
            :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:assembleFdroidRelease
      - name: Verify signer, package, versions and checksums
        env:
          NIGHTLY_CODE: ${{ steps.version.outputs.code }}
          NIGHTLY_NAME: ${{ steps.version.outputs.name }}
        run: python3 scripts/verify_nightly_apks.py
      - name: Preserve verified APKs and manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_CHANNEL == 'nightly' && 'Rhythm-Nightly-Artifacts' || 'Rhythm-Stable-Artifacts' }}
          path: nightly-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test and build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Rhythm-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: python3 scripts/publish_release.py
      - name: Remove signing material
        if: always()
        run: rm -f config/signing/rhythm_keystore.jks .config/keystore.properties config/signing/private.properties
