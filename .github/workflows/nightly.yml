name: Build and Publish Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Separate requested changes can finish without cancelling another commit's signed build.
  group: rhythm-nightly-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: github.repository == 'gustarmartins/Rhythm-the-Mekki-remix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Test Nightly version policy
        run: python3 -m unittest discover -s scripts -p test_nightly_version.py
      - name: Allocate Nightly version
        id: version
        run: python3 scripts/nightly_version.py
      - name: Restore release signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE" && test -n "$SIGNING_PROPERTIES"
          umask 077
          mkdir -p config/signing .config
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > config/signing/rhythm_keystore.jks
          printf '%s' "$SIGNING_PROPERTIES" | base64 --decode > .config/keystore.properties
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 --decode > config/signing/private.properties
          else
            touch config/signing/private.properties
          fi
      - name: Test and build signed release APKs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          NIGHTLY_CODE: ${{ steps.version.outputs.code }}
          NIGHTLY_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx4500m \
            -PversionCodeOverride="$NIGHTLY_CODE" -PversionNameOverride="$NIGHTLY_NAME" \
            -PreleaseDateOverride="$(date -u +%F)" -Pnightly=true \
            :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:assembleFdroidRelease
      - name: Verify signer, package, versions and checksums
        env:
          NIGHTLY_CODE: ${{ steps.version.outputs.code }}
          NIGHTLY_NAME: ${{ steps.version.outputs.name }}
        run: python3 scripts/verify_nightly_apks.py
      # Bootstrap already installed clients whose Nightly downloader still uses nightly.link.
      # Only verified APKs enter this compatibility artifact; new clients use release assets.
      - name: Preserve Nightly downloads for existing clients
        uses: actions/upload-artifact@v7
        with:
          name: Rhythm-Nightly-Artifacts
          path: nightly-dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test and build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Nightly-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish complete Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.version.outputs.tag }}
          NIGHTLY_NAME: ${{ steps.version.outputs.name }}
          NIGHTLY_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 - <<'NOTES'
          import os
          from pathlib import Path
          Path('nightly-notes.md').write_text(
              f"Nightly from `{os.environ['GITHUB_SHA']}`. Android version code: {os.environ['NIGHTLY_CODE']}.\n\n"
              "Use Settings → Updates → Nightly in Rhythm to download the signed APK. "
              "Android may ask you to confirm installation.\n\n"
              "Both distribution flavors and universal/ABI APKs use the existing fork signing key. "
              "Unit tests, release compilation and APK verification passed before publication.\n\n"
              "See the commit history for changes; SHA256SUMS and nightly.json describe these exact APKs.\n")
          NOTES
          gh release create "$NIGHTLY_TAG" nightly-dist/* --target "$GITHUB_SHA" \
            --title "$NIGHTLY_NAME - Rhythm Nightly" --notes-file nightly-notes.md \
            --draft --prerelease
          gh release edit "$NIGHTLY_TAG" --draft=false --latest=false
      - name: Remove signing material
        if: always()
        run: rm -f config/signing/rhythm_keystore.jks .config/keystore.properties config/signing/private.properties
